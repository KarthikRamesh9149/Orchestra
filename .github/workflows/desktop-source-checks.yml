name: Desktop source checks

# Deliberate manual runs only. The owner authorized included Actions minutes
# with the existing account-wide $0/stop-usage budget; no paid runners or storage.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/orchestra_unused
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: '24.19.0'
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix apps/desktop ci
          npm --prefix apps/beta-web ci
          npm --prefix apps/vscode-extension ci
      - name: Generate and validate database client
        run: |
          npm run prisma:generate
          npx --no-install prisma validate
      - name: Source inventory and import provenance
        run: |
          node scripts/desktop/inventory.mjs --check
          node scripts/desktop/verify-import.mjs --check
      - name: Prepare bounded Mac fixture path on the disposable Linux runner
        # These tests use a short path for macOS Unix-domain socket limits.
        # This creates only a runner-owned private test directory, not app state.
        run: sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /private/tmp
      - name: Typecheck and backend build
        run: |
          npm run typecheck
          npx --no-install tsc -p tsconfig.json
      - name: Desktop shell typecheck and build
        run: |
          npm --prefix apps/desktop run typecheck
          npm --prefix apps/desktop run build
      - name: Desktop backend tests
        run: npx --no-install vitest run --config vitest.desktop.config.ts
      - name: Packaging regression tests
        run: npm run test:desktop:packaging
      - name: Install the locked Chromium test browser
        working-directory: apps/beta-web
        run: npx --no-install playwright install --with-deps chromium
      - name: Frontend tests and build
        run: |
          npm --prefix apps/beta-web test
          npm --prefix apps/beta-web run test:styles
          npm --prefix apps/beta-web run build
      - name: Extension build
        run: npm --prefix apps/vscode-extension run build
      - name: Fresh isolated database and migrations
        run: |
          node scripts/desktop/dev-db.mjs up
          node scripts/desktop/dev-db.mjs migrate
          node scripts/desktop/dev-db.mjs provision-runtime
      - name: Durable database job recovery
        run: node scripts/desktop/dev-db.mjs test
      - name: Restricted engine, approvals and backup restoration
        run: node scripts/desktop/dev-db.mjs test-engine
      - name: Stop the disposable database
        if: ${{ always() }}
        run: node scripts/desktop/dev-db.mjs stop
      # Independent gates expose every result even if another audit fails.
      # Failed gates still fail the job; no vulnerabilities are suppressed.
      - name: Backend dependency audit
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=moderate
      - name: Desktop dependency audit
        if: ${{ !cancelled() }}
        run: npm --prefix apps/desktop audit --audit-level=moderate
      - name: Frontend dependency audit
        if: ${{ !cancelled() }}
        run: npm --prefix apps/beta-web audit --audit-level=moderate
      - name: Extension dependency audit
        if: ${{ !cancelled() }}
        run: npm --prefix apps/vscode-extension audit --audit-level=moderate
      - name: Local secret and source security scan
        if: ${{ !cancelled() }}
        run: npm run security:scan:local
      - name: Production mock guard
        if: ${{ !cancelled() }}
        run: npm run beta:web:no-prod-mocks

# This is source and isolated database evidence, not signed Mac/package/provider qualification.
# No caches or artifacts are uploaded, and no deployment/publication occurs.
